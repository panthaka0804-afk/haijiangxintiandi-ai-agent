# ============================================================
#  海江新天地 - 小江AI   Nginx 生产配置
#  作用：HTTPS 终止 + 反向代理 Flask(127.0.0.1:8765) + 安全响应头
#  用法见同目录 README.md
# ============================================================

# ---------- 1) HTTP 80 端口：强制跳转 HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;   # ← 改成你的域名；没域名可临时用 _ 兜底

    # 让 Let's Encrypt 在申请/续期证书时能通过 HTTP-01 校验
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # 其余请求全部 301 跳到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 2) HTTPS 443 端口：正式服务 ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name your-domain.com;   # ← 同上，改成你的域名

    # ---- SSL 证书（certbot 申请后默认就在 /etc/letsencrypt/live/ 下）----
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # ---- SSL 协议与加密套件（禁用 TLS1.0/1.1，仅 TLS1.2/1.3）----
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # ---- SSL 会话复用（提升握手性能）----
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---- OCSP Stapling（加速证书校验，可选）----
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/your-domain.com/chain.pem;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # ---- HSTS（强制浏览器只走 HTTPS）----
    # ⚠️ 首次部署建议先注释掉，确认 HTTPS 一切正常后再打开，否则配错会长时间无法回退
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ---- 安全响应头（always = 即使出错状态码也下发）----
    add_header X-Content-Type-Options          "nosniff"            always;
    add_header X-Frame-Options                 "DENY"               always;
    add_header X-XSS-Protection                "1; mode=block"      always;
    add_header Referrer-Policy                 "strict-origin-when-cross-origin" always;
    # 关闭浏览器高敏感权限（本应用不需要定位/麦克风/摄像头由系统 API 直接调，这里收口网页权限）
    add_header Permissions-Policy              "geolocation=(), microphone=(), camera=()" always;
    # 内容安全策略（详见下方说明）
    add_header Content-Security-Policy         "default-src 'self'; script-src 'self' 'unsafe-inline' 'data:' https://res.wx.qq.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://res.wx.qq.com https://*.qq.com wss:; media-src 'self' https:; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # 隐藏 Nginx 版本号，减少信息泄露
    server_tokens off;

    # ---- 前端静态资源 /vue/（Flask 在 static/vue 提供，这里走反代保持一致）----
    # 若想进一步提升性能，可改为 root /opt/haijiang/dajudali/static/vue; 直接由 nginx 发文件
    location /vue/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 带哈希的静态资源（js/css/图片/字体）可长时间缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|ico)$ {
            proxy_pass http://127.0.0.1:8765;
            expires 30d;
        }
    }

    # ---- 后端 API ----
    location /api/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # API 不缓存（expires 会写入 Cache-Control，不影响上面的安全头）
        expires -1;
    }

    # ---- 兜底：登录页 / 管理后台 / 其它路径交给 Flask ----
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

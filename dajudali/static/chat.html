<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>海江新天地 - AI客服</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F5F5F5;height:100vh;display:flex;flex-direction:column}
/* Top Bar */
.topbar{background:linear-gradient(135deg,#FF7B2C,#FF5722);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.topbar .brand{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700}
.topbar .brand .icon{font-size:28px}
.topbar .actions{display:flex;gap:8px;align-items:center}
.topbar .actions button, .topbar .actions a{background:rgba(255,255,255,0.2);color:#fff;border:none;padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer;text-decoration:none}
/* Quick Entries */
.quick{background:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;overflow-x:auto;border-bottom:1px solid #eee;flex-shrink:0}
.quick button{flex-shrink:0;padding:8px 14px;border:1.5px solid #FFCC80;border-radius:20px;background:#FFF8F0;color:#E65100;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .2s;box-shadow:0 2px 4px rgba(255,123,44,0.1)}.quick button:hover{background:#FFF3E0;border-color:#FF9800;transform:translateY(-1px);box-shadow:0 3px 10px rgba(255,123,44,0.25)}
.tb-btn{flex-shrink:0;padding:4px 8px;border:1px solid #e0e0e0;border-radius:12px;background:#fafafa;color:#757575;font-size:10px;cursor:pointer;white-space:nowrap;transition:all .15s}.tb-btn:hover{background:#f5f5f5;color:#424242}
.quick button:active{background:#FFE0C0}
/* Chat */
.chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.6;word-break:break-word;animation:fadeIn .3s}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,#FF7B2C,#FF5722);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:#fff;color:#333;border-bottom-left-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
.msg .time{font-size:10px;opacity:0.6;margin-top:4px}
.msg .actions{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.msg .actions button{font-size:11px;padding:4px 10px;border:1px solid #ddd;border-radius:12px;background:#fff;color:#666;cursor:pointer}
.msg.ai .actions button{border-color:#FFE0C0;color:#FF7B2C;background:#FFF8F0}
.typing{display:none;align-self:flex-start;background:#fff;padding:16px;border-radius:16px;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
.typing .dots{display:flex;gap:4px}
.typing .dots span{width:8px;height:8px;border-radius:50%;background:#FFB080;animation:bounce 1.4s infinite}
.typing .dots span:nth-child(2){animation-delay:.2s}
.typing .dots span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-8px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes glow{0%,100%{box-shadow:0 4px 15px rgba(230,81,0,0.4)}50%{box-shadow:0 4px 25px rgba(230,81,0,0.7)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
/* Input */
.input-area{background:#fff;padding:10px 16px;display:flex;gap:8px;align-items:flex-end;border-top:1px solid #eee;flex-shrink:0}
.input-area textarea{flex:1;border:none;background:#F5F5F5;border-radius:16px;padding:12px 16px;font-size:14px;resize:none;max-height:100px;font-family:inherit;line-height:1.4}
.input-area textarea:focus{outline:none;background:#FFF0E0}
.input-area button{flex-shrink:0;width:44px;height:44px;border:none;border-radius:50%;background:linear-gradient(135deg,#FF7B2C,#FF5722);color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.input-area button:active{transform:scale(0.95)}
.input-area .voice-btn{background:linear-gradient(135deg,#FF9800,#FF6F00);transition:all .2s}
.input-area .voice-btn.listening{background:linear-gradient(135deg,#F44336,#D32F2F);animation:pulse .8s infinite}
/* Modal */
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);z-index:10;align-items:flex-end;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:24px;width:100%;max-width:500px;max-height:70vh;overflow-y:auto}
.modal h3{font-size:18px;margin-bottom:16px;color:#333}
.modal .fg{margin-bottom:14px}
.modal .fg label{display:block;font-weight:600;font-size:13px;color:#555;margin-bottom:4px}
.modal .fg input,.modal .fg select,.modal .fg textarea{width:100%;padding:10px 12px;border:2px solid #eee;border-radius:10px;font-size:14px;font-family:inherit}
.modal .fg textarea{min-height:80px;resize:vertical}
.modal .fg select{background:#fff}
.modal .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.modal .btns button{padding:10px 24px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
.modal .btns .cancel{background:#eee;color:#666}
.modal .btns .submit{background:#FF7B2C;color:#fff}
/* Toast */
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:20px;color:#fff;font-size:13px;z-index:99;display:none}
.toast.show{display:block;animation:fadeIn .3s}
.toast-success{background:#4CAF50}
.toast-error{background:#F44336}
/* Welcome Cards */
.welcome-cards{padding:0 4px 8px}
.wc-row{display:flex;gap:8px;margin-bottom:8px}
.wc-card{flex:1;background:#fff;border-radius:14px;padding:14px 12px;box-shadow:0 2px 8px rgba(0,0,0,0.06);cursor:pointer;text-align:center;transition:transform .15s}
.wc-card:active{transform:scale(0.96);background:#FFF8F0}
.wc-icon{font-size:28px;margin-bottom:4px}
.wc-text{font-size:14px;font-weight:700;color:#333}
.wc-sub{font-size:11px;color:#999;margin-top:2px}
/* Coupon Modal */
.coupon-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:999;display:none;justify-content:center;align-items:center}
.coupon-modal.show{display:flex}
.coupon-sheet{background:#fff;border-radius:20px;width:340px;max-width:90vw;max-height:75vh;overflow-y:auto;padding:20px}
.coupon-sheet h3{text-align:center;margin:0 0 16px 0;font-size:18px}
.coupon-card{position:relative;background:linear-gradient(135deg,#FF7B2C,#FF9A4D);color:#fff;border-radius:14px;padding:16px;margin-bottom:12px;overflow:hidden}
.coupon-card.used{opacity:.5;pointer-events:none}
.coupon-card .cc-top{display:flex;align-items:center;margin-bottom:10px}
.coupon-card .cc-amount{font-size:36px;font-weight:800;line-height:1;margin-right:8px}
.coupon-card .cc-amount small{font-size:18px}
.coupon-card .cc-detail{font-size:12px;opacity:.9}
.coupon-card .cc-meta{font-size:11px;opacity:.8;line-height:1.6}
.coupon-card .cc-btn{display:inline-block;background:#fff;color:#FF7B2C;border-radius:20px;padding:6px 20px;font-size:13px;font-weight:700;cursor:pointer;margin-top:8px;border:none}
.coupon-card .cc-btn:active{transform:scale(.95)}
.coupon-card .cc-watermark{position:absolute;right:-10px;bottom:-10px;font-size:60px;opacity:.1}
.coupon-close{display:block;width:100%;padding:10px;background:#eee;border:none;border-radius:10px;margin-top:12px;color:#666;font-size:14px;cursor:pointer}
/* Coupon Banner */
.coupon-banner{display:flex;align-items:center;background:linear-gradient(135deg,#FF7B2C,#FF5722);border-radius:16px;padding:14px;margin:0 4px 10px;cursor:pointer;box-shadow:0 4px 16px rgba(255,87,34,.3);animation:cbPulse 2s infinite;position:relative;overflow:hidden}
.coupon-banner::after{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(45deg,transparent 40%,rgba(255,255,255,.15) 50%,transparent 60%);animation:cbShine 3s infinite}
@keyframes cbPulse{0%,100%{box-shadow:0 4px 16px rgba(255,87,34,.3)}50%{box-shadow:0 4px 24px rgba(255,87,34,.5)}}
@keyframes cbShine{0%{transform:translateX(-100%) translateY(-100%)}100%{transform:translateX(100%) translateY(100%)}}
.cb-left{margin-right:12px;position:relative;z-index:1}
.cb-icon{font-size:36px;animation:cbBounce .6s infinite alternate}
@keyframes cbBounce{0%{transform:scale(1)}100%{transform:scale(1.15)}}
.cb-mid{flex:1;color:#fff;position:relative;z-index:1}
.cb-title{font-size:16px;font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,.2)}
.cb-sub{font-size:11px;opacity:.9;margin-top:3px}
.cb-right{position:relative;z-index:1}
.cb-arrow{font-size:28px;color:#fff;opacity:.8;animation:cbArrow 1s infinite alternate}
@keyframes cbArrow{0%{transform:translateX(0)}100%{transform:translateX(4px)}}
/* Barcode Card */
.barcode-card{background:#fff;border-radius:16px;padding:20px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.08);margin:8px 0;border:2px dashed #FF7B2C}
.barcode-card .bc-header{font-size:13px;color:#999;margin-bottom:8px}
.barcode-card .bc-amount{font-size:28px;color:#FF5722;margin-bottom:4px}
.barcode-card .bc-amount b{font-size:44px}
.barcode-card .bc-name{font-size:16px;font-weight:700;color:#333;margin-bottom:12px}
.barcode-card .bc-barcode{margin:10px auto;display:inline-block;padding:8px 12px;background:#fafafa;border-radius:8px}
.barcode-card .bc-code{font-size:18px;font-weight:700;color:#333;letter-spacing:2px;margin:8px 0;font-family:monospace}
.barcode-card .bc-meta{font-size:11px;color:#999;margin-bottom:8px}
.barcode-card .bc-hint{font-size:11px;color:#FF7B2C;font-weight:600}

/* Member Panel */
.member-bar{display:none;background:linear-gradient(135deg,#FFF8F0,#FFF3E0);padding:14px 16px;border-radius:16px;margin:4px 4px 10px;box-shadow:0 2px 12px rgba(255,107,0,.12)}
.member-bar.show{display:flex;align-items:center;gap:10px}
.mb-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#FF6B00,#E65100);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0}
.mb-info{flex:1;min-width:0}
.mb-name{font-size:15px;font-weight:700;color:#333;line-height:1.3}
.mb-meta{font-size:11px;color:#888;margin-top:2px}
.mb-actions{display:flex;gap:4px;flex-shrink:0}
.mb-actions button{padding:6px 10px;border:none;border-radius:16px;font-size:11px;font-weight:600;cursor:pointer;background:#fff;color:#E65100;border:1px solid #FFE0B2}
.mb-actions button:active{background:#FFF3E0}
/* Auth overlay */
.auth-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:9998;display:none;align-items:flex-end;justify-content:center}
.auth-overlay.show{display:flex}
.auth-sheet{background:#fff;border-radius:24px 24px 0 0;width:100%;max-width:500px;padding:24px 20px 32px;box-shadow:0 -8px 40px rgba(0,0,0,.15)}
.auth-sheet h2{font-size:22px;font-weight:800;color:#333;margin:0 0 4px}
.auth-sheet .auth-sub{font-size:12px;color:#999;margin-bottom:20px}
.auth-tabs{display:flex;gap:0;margin-bottom:20px;background:#F5F5F5;border-radius:12px;padding:3px}
.auth-tab{flex:1;text-align:center;padding:10px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;background:transparent;color:#999;transition:all .2s}
.auth-tab.active{background:#fff;color:#E65100;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.auth-input{width:100%;padding:12px 16px;border:2px solid #eee;border-radius:12px;font-size:15px;margin-bottom:12px;outline:none;font-family:inherit}
.auth-input:focus{border-color:#FFB74D}
.auth-btn{width:100%;padding:14px;border:none;border-radius:14px;background:linear-gradient(135deg,#FF6B00,#E65100);color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:4px}
.auth-btn:active{transform:scale(.98);opacity:.9}
.auth-close{display:block;width:100%;padding:12px;background:none;border:none;color:#999;font-size:14px;margin-top:8px;cursor:pointer}
/* Coupons panel */
.cpn-panel{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:9998;display:none;align-items:flex-end;justify-content:center}
.cpn-panel.show{display:flex}
.cpn-sheet{background:#fff;border-radius:24px 24px 0 0;width:100%;max-width:500px;max-height:70vh;overflow-y:auto;padding:24px 20px 16px}
.cpn-sheet h2{font-size:20px;font-weight:800;color:#333;margin:0 0 16px}
.cpn-item{display:flex;align-items:center;gap:12px;padding:12px;background:#FFF8F0;border-radius:12px;margin-bottom:8px}
.cpn-icon{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#FF6B00,#E65100);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;flex-shrink:0}
.cpn-code{font-size:15px;font-weight:700;color:#333;word-break:break-all}
.cpn-date{font-size:11px;color:#999;margin-top:2px}
.cpn-close{display:block;width:100%;padding:12px;background:#eee;border:none;border-radius:12px;color:#666;font-size:14px;cursor:pointer;margin-top:8px}
/* Points panel */
.pts-section{margin-bottom:16px}
.pts-header{background:linear-gradient(135deg,#FFF8F0,#FFF3E0);border-radius:16px;padding:16px;margin-bottom:12px;text-align:center}
.pts-value{font-size:32px;font-weight:800;color:#E65100;line-height:1}
.pts-label{font-size:12px;color:#999;margin-top:4px}
.pts-gift{display:flex;align-items:center;justify-content:space-between;padding:14px;border:1px solid #eee;border-radius:12px;margin-bottom:8px}
.pts-gift-name{font-size:14px;font-weight:600;color:#333}
.pts-gift-cost{font-size:13px;color:#E65100;font-weight:700}
.pts-gift-value{font-size:11px;color:#999}
.pts-gift-btn{padding:8px 16px;border:none;border-radius:16px;background:linear-gradient(135deg,#FF6B00,#E65100);color:#fff;font-size:12px;font-weight:600;cursor:pointer}
.pts-gift-btn:disabled{background:#ccc;cursor:default}
/* Four search buttons */
.search-btns{display:flex;gap:6px;overflow-x:auto;padding:4px 0;flex-shrink:0}
.search-btns button{flex-shrink:0;padding:10px 18px;border:none;border-radius:22px;background:linear-gradient(135deg,#FF6B00,#E65100);color:#fff;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;box-shadow:0 2px 8px rgba(230,81,0,.25)}
.search-btns button:active{transform:scale(.96)}
/* Nav overlay */
.nav-overlay{position:fixed;inset:0;z-index:9999;background:#F2EFE9;display:none;flex-direction:column}
.nav-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);border-bottom:1px solid rgba(0,0,0,.08)}
.nav-header h2{font-size:18px;font-weight:700;color:#333;margin:0}
.nav-close-btn{width:36px;height:36px;border:none;background:rgba(0,0,0,.05);border-radius:50%;font-size:20px;cursor:pointer;color:#666}
.nav-floors{display:flex;gap:8px;padding:12px 16px 8px}
.nav-floors button{border:none;padding:8px 20px;border-radius:20px;font-size:14px;font-weight:600;cursor:pointer;background:rgba(0,0,0,.05);color:#666}
.nav-floors button.active{background:#E65100;color:#fff}
.nav-search-box{padding:0 16px 12px}
.nav-search-box input{width:100%;padding:10px 16px;border:1px solid #ddd;border-radius:24px;font-size:15px;outline:none;background:#fff}
.nav-results{display:none;background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.15);max-height:180px;overflow-y:auto;margin-top:4px}
.nav-result-item{padding:10px 16px;cursor:pointer;font-size:14px;border-bottom:1px solid #f0f0f0}
.nav-result-item:active{background:#f5f5f5}
.nav-map{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:8px}
/* Quick replies under bot messages */
.qr-btns{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.qr-btns button{padding:5px 12px;border:1.5px solid #FFCC80;border-radius:14px;background:#FFF8F0;color:#E65100;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap}
.qr-btns button:active{background:#FFE0C0}

</style>
</head>
<body>
<div class="topbar">
<div class="brand"><span class="icon"></span>海江新天地</div>
<div class="actions"><span style="font-size:11px;opacity:0.8">{{tenant_name}}</span><a href="#" onclick="showCoupons()"> 领券</a><a href="#" onclick="clearChat()">新对话</a></div>
</div>
<div class="quick">

</div
</div>

  <div class="mb-avatar" id="mbAvatar">M</div>
  <div class="mb-info">
    <div class="mb-name" id="mbName">--</div>
    <div class="mb-meta" id="mbMeta">--</div>
  </div>
  <div class="mb-actions">
    <button onclick="showMyCoupons()">[我的券]</button>
    <button onclick="showMyPoints()">[积分兑]</button>

  </div>
</div>
<div class="search-btns">
  <button onclick="quickSend('找优惠')">找优惠</button>
  <button onclick="quickSend('找活动')">找活动</button>
  <button onclick="quickSend('找店铺')">找店铺</button>
  <button onclick="quickSend('找商品')">找商品</button>
</div>

function addMsg(text,type,actions){

if(type=='ai') text=text.replace(/<script[\s\S]*?<\/script>/gi,'').replace(/on\w+=/gi,'');
// Make links clickable
if(type=='ai'){
text=text.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" style="color:#FF7B2C">$1</a>');
text=text.replace(/(#[^\s]*小程序:\/\/[^\s]+)/g,'<a href="$1" style="color:#FF7B2C">$1</a>');
}
d.innerHTML=text+'<div class="time">'+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})+'</div>';
if(actions){d.innerHTML+='<div class="actions">'+actions+'</div>'}

document.getElementById('chatBox').scrollTop=document.getElementById('chatBox').scrollHeight;

async function sendMsg(){
var input=document.getElementById('userInput'),msg=input.value.trim();
if(!msg)return;
input.value='';input.focus();
addMsg(msg,'user');
// Intercept: keywords trigger inline forms
var kw=msg.toLowerCase();
if(kw.includes('活动报名')||kw==='报名'||kw.includes('怎么报名')||kw.includes('如何报名')){
document.getElementById('typing').style.display='none';
openRegister();
return;
}
if(kw.includes('报修')||kw.includes('坏了')||kw.includes('漏水')||kw.includes('维修')){
document.getElementById('typing').style.display='none';
openOrder('报修');
return;
}
if(kw.includes('投诉')){
document.getElementById('typing').style.display='none';
openOrder('投诉');
return;
}
if(kw.includes('预约')||kw.includes('订包厢')||kw.includes('排队')||kw.includes('订场')||kw.includes('球场')||kw.includes('包间')){
document.getElementById('typing').style.display='none';
openBooking();
return;
}
document.getElementById('typing').style.display='block';
document.getElementById('chatBox').scrollTop=document.getElementById('chatBox').scrollHeight;
try{
var r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg})});
var j=await r.json();
document.getElementById('typing').style.display='none';
if(j.ok){
var actions='';
if(j.reply.includes('正在为您生成报修工单')||msg.includes('报修')){
actions='<button onclick="openOrder(\'报修\')"> 提交报修工单</button>';
}
if(msg.includes('投诉'))actions='<button onclick="openOrder(\'投诉\')"> 提交投诉工单</button>';
if(msg.includes('入驻')||msg.includes('开店')||msg.includes('招商'))actions='<button onclick="openOrder(\'商务\')"> 提交商务意向</button>';
addMsg(j.reply,'ai',actions);
}else{addMsg('抱歉，系统繁忙，请稍后再试~','ai')}
}catch(e){document.getElementById('typing').style.display='none';addMsg('网络错误，请检查连接','ai')}
}

// ============ Voice Input ============
var _voiceListening = false;
var _recognition = null;
var _isWechat = /MicroMessenger/i.test(navigator.userAgent);

function initVoice(){
if(_isWechat){
loadWechatSDK();
return;
}
if(!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)){
document.getElementById('voiceBtn').style.display='none';
return;
}
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
_recognition = new SR();
_recognition.lang = 'zh-CN';
_recognition.interimResults = true;
_recognition.continuous = false;
_recognition.maxAlternatives = 1;
_recognition.onresult = function(e){
var text = '';
for(var i=e.resultIndex;i<e.results.length;i++){
text += e.results[i][0].transcript;
}
document.getElementById('userInput').value = text;
document.getElementById('userInput').dispatchEvent(new Event('input'));
};
_recognition.onend = function(){
_voiceListening = false;
document.getElementById('voiceBtn').classList.remove('listening');
document.getElementById('voiceBtn').textContent = '\uD83C\uDFA4';
var input = document.getElementById('userInput');
if(input.value.trim()){
setTimeout(function(){ sendMsg(); }, 300);
}
};
_recognition.onerror = function(e){
_voiceListening = false;
document.getElementById('voiceBtn').classList.remove('listening');
document.getElementById('voiceBtn').textContent = '\uD83C\uDFA4';
if(e.error === 'not-allowed') toast('请允许麦克风权限','error');
else if(e.error !== 'no-speech') toast('语音识别失败，请重试','error');
};
}

var _wxVoice = { recording: false, localId: '' };
function loadWechatSDK(){
var s = document.createElement('script');
s.src = 'https://res.wx.qq.com/open/js/jweixin-1.6.0.js';
s.onload = function(){ initWxConfig(); };
document.head.appendChild(s);
}
function initWxConfig(){
if(!window.wx) return;
var xhr = new XMLHttpRequest();
xhr.open('GET', '/api/wx-config?url=' + encodeURIComponent(location.href.split('#')[0]));
xhr.onload = function(){
try{
var cfg = JSON.parse(xhr.responseText);
if(cfg.ok){
wx.config({ debug: false, appId: cfg.appId, timestamp: cfg.timestamp, nonceStr: cfg.nonceStr, signature: cfg.signature, jsApiList: ['startRecord','stopRecord','uploadVoice','downloadVoice','translateVoice'] });
wx.ready(function(){ _voiceReady = true; });
wx.error(function(e){ console.log('wx error', e); });
}
}catch(e){}
};
xhr.send();
}
var _voiceReady = false;

function toggleVoice(){
if(_isWechat){ toggleWechatVoice(); return; }
if(!_recognition){ initVoice(); if(!_recognition) return; }
if(_voiceListening){
_recognition.stop();
_voiceListening = false;
document.getElementById('voiceBtn').classList.remove('listening');
document.getElementById('voiceBtn').textContent = '\uD83C\uDFA4';
}else{
_recognition.start();
_voiceListening = true;
document.getElementById('voiceBtn').classList.add('listening');
document.getElementById('voiceBtn').textContent = '\uD83D\uDD34';
toast('正在收听...','success');
}
}

function toggleWechatVoice(){
if(!window.wx || !_voiceReady){ toast('微信接口加载中，请稍后再试','error'); return; }
if(_wxVoice.recording){
wx.stopRecord({
success: function(res){
_wxVoice.recording = false;
_wxVoice.localId = res.localId;
document.getElementById('voiceBtn').classList.remove('listening');
document.getElementById('voiceBtn').textContent = '\uD83C\uDFA4';
toast('识别中...','success');
wx.uploadVoice({
localId: res.localId,
success: function(upRes){
var serverId = upRes.serverId;
fetch('/api/wx-voice', {
method: 'POST',
headers: {'Content-Type': 'application/json'},
body: JSON.stringify({serverId: serverId})
}).then(function(r){ return r.json(); }).then(function(j){
if(j.ok && j.text){
document.getElementById('userInput').value = j.text;
document.getElementById('userInput').dispatchEvent(new Event('input'));
setTimeout(function(){ sendMsg(); }, 200);
}else{ toast(j.error||'语音识别失败','error'); }
}).catch(function(){ toast('网络错误','error'); });
},
fail: function(){ toast('语音上传失败','error'); }
});
}
});
}else{
wx.startRecord({
success: function(){
_wxVoice.recording = true;
document.getElementById('voiceBtn').classList.add('listening');
document.getElementById('voiceBtn').textContent = '\uD83D\uDD34';
toast('正在录音...请说话','success');
},
fail: function(){ toast('录音失败，请重试','error'); }
});
}
}

// Code128B barcode encoder
function drawCode128(canvasId,text){
var canvas=document.getElementById(canvasId);
if(!canvas)return;
var ctx=canvas.getContext('2d');
ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
// Encode to Code128B pattern
var patterns=code128Patterns();
var bars=[patterns.START_B];
var checksum=104; // START_B value
for(var i=0;i<text.length;i++){
var c=text.charCodeAt(i);
if(c<32||c>126)c=32;
var val=c-32;
bars.push(patterns[val]);
checksum+=val*(i+1);
}
checksum=checksum%103;
bars.push(patterns[checksum]);
bars.push(patterns.STOP);
// Draw bars
var totalWidth=bars.reduce(function(s,p){return s+patternWidth(p)},0);
var x=(canvas.width-totalWidth)/2;
var y=4;
var h=50;
for(var b=0;b<bars.length;b++){
var p=bars[b];
for(var j=0;j<p.length;j++){
var w=p.charCodeAt(j)-48; // '0'=thin, '1'=thick
ctx.fillStyle=(j%2==0)?'#000':'#fff';
ctx.fillRect(x,y,(w+1)*1.5,h);
x+=(w+1)*1.5;
}
}
// Draw text below
ctx.fillStyle='#333';
ctx.font='bold 14px monospace';
ctx.textAlign='center';
ctx.fillText(text,canvas.width/2,68);
}
function patternWidth(p){var w=0;for(var i=0;i<p.length;i++)w+=(p.charCodeAt(i)-48+1)*1.5;return w}

var _authTab = 'login';
function showAuth() { document.getElementById('authOverlay').classList.add('show'); }
function closeAuth() { document.getElementById('authOverlay').classList.remove('show'); }
function switchAuthTab(tab) {
  _authTab = tab;
  var tabs = document.querySelectorAll('.auth-tab');
  tabs[0].className = tab === 'login' ? 'auth-tab active' : 'auth-tab';
  tabs[1].className = tab === 'register' ? 'auth-tab active' : 'auth-tab';
  document.getElementById('authLoginForm').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('authRegForm').style.display = tab === 'register' ? 'block' : 'none';
}

function doLogin() {
  var phone = document.getElementById('authPhone').value.trim();
  if (!phone || phone.length < 11) { toast('请输入正确的手机号','error'); return; }
  var xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/member/portal');
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.onload = function() {
    var j = JSON.parse(xhr.responseText);
    if (j.ok) {
      _memberData = j.member;
      if (window.sessionStorage) sessionStorage.setItem('__dj_member', JSON.stringify(_memberData));
      updateMemberBar();
      closeAuth();
      toast('登录成功, '+j.member.display_name,'success');
    } else {
      toast(j.error || '登录失败','error');
    }
  };
  xhr.send(JSON.stringify({phone: phone}));
}

function doRegister() {
  var name = document.getElementById('regDisplayName').value.trim();
  var phone = document.getElementById('regPhone').value.trim();
  if (!name) { toast('请输入称呼','error'); return; }
  if (!phone || phone.length < 11) { toast('请输入正确的手机号','error'); return; }
  var xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/member/register');
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.onload = function() {
    var j = JSON.parse(xhr.responseText);
    if (j.ok) {
      _memberData = j.user;
      _memberData.membership_level = '普卡';
      _memberData.discount = '98';
      _memberData.desc = '消费1元=1积分';
      _memberData.points = 500;
      if (window.sessionStorage) sessionStorage.setItem('__dj_member', JSON.stringify(_memberData));
      updateMemberBar();
      closeAuth();
      toast('注册成功! 赠送500积分','success');
    } else {
      toast(j.error || '注册失败','error');
    }
  };
  xhr.send(JSON.stringify({display_name: name, phone: phone}));
}

function doLogout() {
  _memberData = null;
  if (window.sessionStorage) sessionStorage.removeItem('__dj_member');
  document.getElementById('memberBar').classList.remove('show');
  toast('已退出登录','success');
}

function updateMemberBar() {
  if (!_memberData) return;
  var bar = document.getElementById('memberBar');
  bar.classList.add('show');
  var name = _memberData.display_name || '会员';
  document.getElementById('mbAvatar').textContent = name.charAt(0);
  document.getElementById('mbName').textContent = name;
  var lv = _memberData.membership_level || '普卡';
  var pts = _memberData.points || 0;
  var disc = _memberData.discount || '98';
  document.getElementById('mbMeta').textContent = lv + ' · ' + disc + '折 · ' + pts + '积分';
}

        h += '<div style="text-align:center;color:#999;padding:10px">积分不足，暂无商品可兑换</div>';
      }

  };
  xhr.send(JSON.stringify({phone: _memberData.phone}));
}

function closePtsPanel() { document.getElementById('ptsPanel').classList.remove('show'); }

function redeemGift(gid) {
  if (!_memberData || !_memberData.phone) return;
  if (!confirm('确认兑换此礼品？将扣减对应积分')) return;
  var xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/member/redeem');
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.onload = function() {
    var j = JSON.parse(xhr.responseText);
    if (j.ok) {
      toast('兑换成功!','success');
      closePtsPanel();
      // Refresh member data
      var xhr2 = new XMLHttpRequest();
      xhr2.open('POST', '/api/member/portal');
      xhr2.setRequestHeader('Content-Type', 'application/json');
      xhr2.onload = function() {
        var j2 = JSON.parse(xhr2.responseText);
        if (j2.ok) { _memberData = j2.member; updateMemberBar(); }
      };
      xhr2.send(JSON.stringify({phone: _memberData.phone}));
    } else {
      toast(j.error || '兑换失败','error');
    }
  };
  xhr.send(JSON.stringify({phone: _memberData.phone, redeem_id: gid}));
}

    var r = rooms[i], cx = r.x + r.w / 2, cy = r.y + r.h / 2;
    var fs = r.name.length > 6 ? 11 : 13;
    svg += '<g><rect x="' + r.x + '" y="' + r.y + '" width="' + r.w + '" height="' + r.h + '" rx="8" fill="' + r.color + '" fill-opacity=".12" stroke="' + r.color + '" stroke-width="1.5" filter="url(#ns)"/><text x="' + cx + '" y="' + (cy - 4) + '" text-anchor="middle" font-size="' + fs + '" font-weight="600" fill="#333">' + r.name + '</text></g>';
  }
  svg += '</svg>';
  document.getElementById('navMapArea').innerHTML = svg;
}

function _navSearch() {
  var q = document.getElementById('navSearchInput').value;
  var res = document.getElementById('navSearchResults');
  if (!q) { res.style.display = 'none'; return; }
  var items = [];
  for (var f in window._nr) {
    for (var i = 0; i < window._nr[f].length; i++) {
      var r = window._nr[f][i];
      if (r.name.indexOf(q) >= 0 || r.type.indexOf(q) >= 0) {
        items.push({f: f, n: r.name});
      }
    }
  }
  if (!items.length) { res.style.display = 'none'; return; }
  var h = '';
  for (var j = 0; j < Math.min(items.length, 10); j++) {
    var it = items[j];
    h += '<div class="nav-result-item" onclick="window._nfloor=\'' + it.f + '\';_renderNav();document.getElementById(\'navSearchInput\').value=\'' + it.n + '\'">' + it.n + ' · ' + it.f + '</div>';
  }
  res.innerHTML = h;
  res.style.display = 'block';
}

// ============ Session restore ============
var _memberData = null;
(function() {
  try {
    var stored = window.sessionStorage && sessionStorage.getItem('__dj_member');
    if (stored) { _memberData = JSON.parse(stored); updateMemberBar(); }
  } catch(e) {}
})();

// ============ Quick reply detection ============
var _origSendMsg = sendMsg;
sendMsg = function() {
  _origSendMsg();
  // After sending, wait for AI response then check for quick replies
  setTimeout(function() {
    var msgs = document.querySelectorAll('.msg.ai');
    if (msgs.length) {
      var last = msgs[msgs.length - 1];
      checkQuickReplies(last);
    }
  }, 1500);
};

function checkQuickReplies(msgEl) {
  var txt = msgEl.textContent || '';
  var btns = [];
  // Category buttons based on content
  if (txt.indexOf('餐饮') >= 0 || txt.indexOf('美食') >= 0 || txt.indexOf('火锅') >= 0) {
    btns.push('[火锅]', '[披萨]', '[小吃]', '[咖啡]');
  }
  if (txt.indexOf('亲子') >= 0 || txt.indexOf('儿童') >= 0 || txt.indexOf('乐园') >= 0) {
    btns.push('[亲子]', '[夜校]', '[DIY]', '[运动]');
  }
  if (txt.indexOf('停车场') >= 0 || txt.indexOf('停车') >= 0) {
    btns.push('[停车费]', '[优惠]', '[位置]');
  }
  if (btns.length) {
    var h = '<div class="qr-btns">';
    for (var i = 0; i < btns.length; i++) {
      h += '<button onclick="quickSend(\'' + btns[i] + '\')">' + btns[i] + '</button>';
    }
    h += '</div>';
    msgEl.innerHTML += h;
  }
}

</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>海江新天地 - 登录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(180deg,#FF7B2C 0%,#FF9A4D 40%,#FFF5EC 100%);min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border-radius:20px;padding:36px 28px;width:380px;max-width:90vw;box-shadow:0 8px 40px rgba(0,0,0,0.12)}
.logo{text-align:center;margin-bottom:8px}
.logo .icon{font-size:48px}
.logo h1{font-size:26px;color:#FF7B2C;margin:4px 0}
.logo p{color:#999;font-size:13px}
.fg{margin-bottom:18px}
.fg label{display:block;font-weight:600;font-size:13px;color:#555;margin-bottom:6px}
.fg input{width:100%;padding:12px 14px;border:2px solid #eee;border-radius:12px;font-size:15px;transition:border-color .2s}
.fg input:focus{outline:none;border-color:#FF7B2C}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,#FF7B2C,#FF5722);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(0.98)}
.error{background:#FFF0F0;color:#D32F2F;padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:16px;display:none}
.hint{text-align:center;margin-top:16px;font-size:12px;color:#aaa}
.hint span{background:#FFF5EC;color:#FF7B2C;padding:2px 8px;border-radius:4px;font-weight:600}
</style>
</head>
<body>
<div class="card">
<div class="logo">
<div class="icon">🍊</div>
<h1>海江新天地</h1>
<p>社区商业AI客服系统</p>
</div>
<div class="error" id="err"></div>
<div class="fg"><label>用户名</label><input id="uname" placeholder="请输入用户名" autofocus></div>
<div class="fg"><label>密码</label><input id="upw" type="password" placeholder="请输入密码"></div>
<button class="btn" onclick="login()">登 录</button>
<div class="hint">演示账号：<span>demo</span> / <span>demo123</span></div>
</div>
<script>
document.getElementById('upw').addEventListener('keydown',function(e){if(e.key==='Enter')login()});
async function login(){
var u=document.getElementById('uname').value.trim(),p=document.getElementById('upw').value.trim();
if(!u||!p)return;
try{
var r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
var j=await r.json();
if(j.ok){location.href=j.redirect}
else{document.getElementById('err').textContent=j.error;document.getElementById('err').style.display='block'}
}catch(e){document.getElementById('err').textContent='网络错误，请稍后重试';document.getElementById('err').style.display='block'}
}
</script>
</body>
</html>

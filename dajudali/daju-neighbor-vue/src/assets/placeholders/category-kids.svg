<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0FFF0"/>
      <stop offset="100%" stop-color="#D8F8D8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#bg)" rx="16"/>
  <!-- playground -->
  <circle cx="140" cy="120" r="30" fill="#4CAF50" opacity="0.15"/>
  <circle cx="260" cy="120" r="30" fill="#4CAF50" opacity="0.15"/>
  <circle cx="200" cy="100" r="35" fill="#4CAF50" opacity="0.2"/>
  <!-- slide -->
  <line x1="130" y1="170" x2="270" y2="170" stroke="#4CAF50" stroke-width="6" opacity="0.3" stroke-linecap="round"/>
  <line x1="130" y1="80" x2="130" y2="170" stroke="#4CAF50" stroke-width="6" opacity="0.3" stroke-linecap="round"/>
  <line x1="130" y1="80" x2="220" y2="80" stroke="#4CAF50" stroke-width="6" opacity="0.3" stroke-linecap="round"/>
  <text x="200" y="220" text-anchor="middle" font-size="13" fill="#4A7A4A" font-family="sans-serif" font-weight="600">亲自娱乐</text>
</svg>

  </defs>
  <rect width="400" height="260" fill="url(#bg)" rx="16"/>
  <!-- plate -->
  <circle cx="200" cy="120" r="70" fill="#FF7B2C" opacity="0.15"/>
  <circle cx="200" cy="120" r="50" fill="#FF7B2C" opacity="0.25"/>
